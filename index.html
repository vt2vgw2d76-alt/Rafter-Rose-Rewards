<script>
  function updateHomeLogo() {
    const activeTab = document.querySelector(
      '.tabs button.active'
    );
    const isHome = activeTab?.dataset.tab === 'rewards';

    document.getElementById('app-header')
      .classList.toggle('home-header', isHome);

    document.querySelector('.home-logo')
      .style.display = isHome ? 'block' : 'none';
  }

  document.getElementById('tabs')
    .addEventListener('click', () => {
      requestAnimationFrame(updateHomeLogo);
    });

  updateHomeLogo();
</script>
