
<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#293f34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">

<title>Rafter & Rose Rewards</title>

<style>
:root {
  font-family: ui-sans-serif, -apple-system,
    BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #293f34;
  background: #f8f4ec;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
}

header {
  background: #293f34;
  color: #f8f4ec;
  padding: 26px 20px 24px;
  text-align: center;
}

.home-logo {
  display: block;
  width: 110px;
  max-width: 60%;
  height: auto;
  margin: 0 auto 12px;
  object-fit: contain;
  filter: brightness(0) saturate(100%)
    invert(93%) sepia(12%)
    saturate(270%) hue-rotate(337deg)
    brightness(104%) contrast(94%);
}

header h1 {
  margin: 8px 0 0;
  font-family: Georgia, serif;
  font-weight: 400;
  font-size: 28px;
}

main {
  max-width: 600px;
  margin: auto;
  padding: 24px 16px 30px;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 14px 16px;
  background: #eee8dd;
}

.tabs button {
  white-space: nowrap;
  background: white;
  color: #293f34;
}

.tabs button.active {
  background: #293f34;
  color: white;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 13px 16px;
  background: #293f34;
  color: white;
  font-size: 15px;
  font-weight: 650;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
}

button.secondary {
  background: #e7dfd0;
  color: #293f34;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 15px;
  box-shadow: 0 2px 14px #293f3410;
}

.hero {
  background: #293f34;
  color: #f8f4ec;
}

.hero p {
  color: #e5d9c5;
}

.balance {
  font-size: 44px;
  font-family: Georgia, serif;
  margin: 5px 0 14px;
}

.muted {
  color: #657569;
  font-size: 14px;
}

h2 {
  font-family: Georgia, serif;
  font-size: 25px;
  font-weight: 400;
  margin: 0 0 12px;
}

h3 {
  margin: 0 0 8px;
}

p {
  line-height: 1.5;
}

.qr {
  display: block;
  margin: 18px auto;
  background: white;
  border-radius: 12px;
  padding: 12px;
  width: 220px;
  max-width: 100%;
  height: 220px;
  object-fit: contain;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.tile {
  background: #e8e0d2;
  border-radius: 13px;
  padding: 18px;
  min-height: 110px;
}

.tile b {
  display: block;
  margin: 10px 0 4px;
}

label {
  display: block;
  font-weight: 650;
  margin: 15px 0 6px;
}

input, textarea {
  width: 100%;
  border: 1px solid #c8cbbf;
  border-radius: 10px;
  padding: 13px;
  font: inherit;
  font-size: 16px;
  background: white;
}

input:focus, textarea:focus {
  outline: 2px solid #8c9d83;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.row > * {
  min-width: 0;
}

.pill {
  background: #efe7d8;
  border-radius: 20px;
  padding: 7px 11px;
  font-size: 12px;
  font-weight: 700;
}

.notice {
  background: #fff0d6;
  border-left: 4px solid #b58138;
  padding: 12px;
  border-radius: 8px;
  margin: 12px 0;
  font-size: 14px;
}

.good {
  background: #e1efdf;
  border-left-color: #53835b;
}

.hidden {
  display: none;
}

video {
  width: 100%;
  border-radius: 12px;
  background: #111;
  max-height: 300px;
}

footer {
  text-align: center;
  color: #6c786d;
  font-size: 12px;
  padding: 20px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}

footer a {
  color: #657569;
  text-decoration: none;
}

.bigbtn {
  width: 100%;
  margin-top: 12px;
}

.mini {
  font-size: 12px;
}

.divider {
  border: 0;
  border-top: 1px solid #e4e5dc;
  margin: 16px 0;
}
</style>
</head>

<body>

<header id="app-header">
  <img
    src="https://raw.githubusercontent.com/vt2vgw2d76-alt/Rafter-rose-website/main/assets/images/logo%20-%20transparent.png"
    alt="Rafter & Rose"
    class="home-logo"
  >
  <h1>It's the little things.</h1>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="rewards" class="active">
    My rewards
  </button>

  <button data-tab="staff">
    Staff access
  </button>
</nav>

<main id="view"></main>

<footer>
  <p>Rafter & Rose Rewards · Testing phase</p>
  <a href="https://rafterandrose.com">
    Visit our website
  </a>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="./app.js"></script>


<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker
    .register("./sw.js")
    .catch(console.error);
}
</script>

</body>
</html>
